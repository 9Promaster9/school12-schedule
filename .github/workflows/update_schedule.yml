name: Update School Schedule

on:
  schedule:
    # Every 30 minutes Mon-Sat from 03:00 to 17:00 UTC (07:00 to 21:00 Europe/Saratov)
    - cron: '*/30 3-17 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'parser/requirements.txt'

      - name: Install parser dependencies
        run: pip install -r parser/requirements.txt

      - name: Fetch and parse schedule PDFs
        run: python parser/fetch_schedule.py

      - name: Commit and push updated schedule.json
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/schedule.json
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "chore(schedule): update docs/schedule.json"
            git push
          fi
